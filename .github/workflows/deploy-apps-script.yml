name: Deploy Apps Script

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: apps-script-production
  cancel-in-progress: false

jobs:
  release:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.release.outputs.matrix }}

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Validate production tag
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Resolve all deployment targets
        id: release
        run: node tool/resolve-release.mjs "$GITHUB_REF_NAME" "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Validate repository
        run: npm run check

  deploy:
    name: Deploy ${{ matrix.project }} production
    needs: release
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ matrix.environment }}

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Apps Script target
        env:
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          SPREADSHEET_TITLE: ${{ vars.SPREADSHEET_TITLE }}
        run: npm run project:configure

      - name: Validate Apps Script files
        run: npm run status

      - name: Configure clasp credentials
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [[ -z "$CLASPRC_JSON" ]]; then
            echo "CLASPRC_JSON environment secret is not configured."
            exit 1
          fi
          CLASP_AUTH_FILE="$RUNNER_TEMP/.clasprc.json"
          printf '%s' "$CLASPRC_JSON" > "$CLASP_AUTH_FILE"
          chmod 600 "$CLASP_AUTH_FILE"
          echo "CLASP_AUTH_FILE=$CLASP_AUTH_FILE" >> "$GITHUB_ENV"

      - name: Push tagged source to Apps Script
        run: npx clasp --auth "$CLASP_AUTH_FILE" push --force


  notify:
    name: Notify release or deploy result
    needs: [release, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      NOTIFY_DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
      NOTIFY_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      NOTIFY_TELEGRAM_TARGETS: ${{ secrets.TELEGRAM_TARGETS }}
    steps:
      - name: Checkout trusted notification template
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Notify Discord and Telegram
        uses: ziqq/actions/notify@ccd1a799683cd461a45d9303ac6fcb2792f8f5d2
        with:
          providers: discord,telegram
          template-path: .github/notify/templates/release.md
          variables: |
            {
              "pub_dev_url": "",
              "status_label": ${{ toJSON(contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || contains(needs.*.result, 'skipped') && 'skipped' || 'success') }}
            }
          failure-policy: required
          timeout-ms: "10000"
          max-attempts: "5"
          discord-webhooks: ${{ env.NOTIFY_DISCORD_WEBHOOKS }}
          telegram-bot-token: ${{ env.NOTIFY_TELEGRAM_BOT_TOKEN }}
          telegram-targets: ${{ env.NOTIFY_TELEGRAM_TARGETS }}
